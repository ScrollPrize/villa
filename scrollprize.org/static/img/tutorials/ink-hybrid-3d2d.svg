<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-labelledby="t d">
  <title id="t">Hybrid 3D-to-2D ink detection model</title>
  <desc id="d">A patch of 17 surface-volume slices, 128 by 128 pixels, passes through two 3D convolution layers (3x3x3 kernels, 16 channels). The features are pooled over depth in two ways, an attention-weighted sum and a maximum, and concatenated into a 32-channel 2D map. A six-stage residual 2D U-Net with skip connections turns that map into an ink probability for every pixel. The output panel shows a crop of a real prediction, with two Greek letters legible as bright strokes.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .kicker { font-size: 11.5px; letter-spacing: 1.4px; fill: rgba(255,255,255,0.55); }
      .title { font-size: 13.5px; font-weight: 600; fill: #E6E8EA; }
      .label { font-size: 12.5px; fill: #B7BCC2; }
      .sub { font-size: 11px; fill: rgba(255,255,255,0.55); }
      .shape { font-size: 11.5px; fill: rgba(255,255,255,0.45); }
      .rule { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .box { fill: #1F2327; stroke: rgba(255,255,255,0.18); }
      .flow { stroke: #E5502B; stroke-width: 1.6; fill: none; }
      .wire { stroke: rgba(255,255,255,0.45); stroke-width: 1.2; fill: none; }
      .skip { stroke: rgba(255,255,255,0.38); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
      .enc { fill: #4C535B; }
      .dec { fill: #5E666F; }
    </style>
    <marker id="arrowFlow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L7,4 L0,7.5 Z" fill="#E5502B"/>
    </marker>
    <marker id="arrowWire" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L7,4 L0,7.5 Z" fill="rgba(255,255,255,0.55)"/>
    </marker>
    <marker id="arrowSkip" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L6,3.5 L0,6.5 Z" fill="rgba(255,255,255,0.45)"/>
    </marker>
    <clipPath id="outClip"><rect x="799" y="166" width="56" height="56" rx="3"/></clipPath>
  </defs>

  <!-- canvas -->
  <rect width="900" height="356" fill="#16181B"/>

  <!-- section headings -->
  <g class="mono kicker">
    <text x="72" y="44" text-anchor="middle">INPUT</text>
    <text x="140" y="44">LOCAL 3D STEM</text>
    <text x="565" y="44">2D U-NET</text>
    <text x="827" y="44" text-anchor="middle">OUTPUT</text>
  </g>
  <g class="rule">
    <line x1="38" y1="54" x2="106" y2="54"/>
    <line x1="140" y1="54" x2="548" y2="54"/>
    <line x1="565" y1="54" x2="761" y2="54"/>
    <line x1="799" y1="54" x2="855" y2="54"/>
  </g>

  <g transform="translate(0,-36)">
    <!-- ===== INPUT: a stack of 17 slices ===== -->
    <g>
      <rect x="54" y="160" width="52" height="52" rx="2" fill="#1E2226" stroke="rgba(255,255,255,0.18)"/>
      <rect x="50" y="164" width="52" height="52" rx="2" fill="#20242A" stroke="rgba(255,255,255,0.22)"/>
      <rect x="46" y="168" width="52" height="52" rx="2" fill="#23282D" stroke="rgba(255,255,255,0.26)"/>
      <rect x="42" y="172" width="52" height="52" rx="2" fill="#272C32" stroke="rgba(255,255,255,0.32)"/>
      <rect x="38" y="176" width="52" height="52" rx="2" fill="#2C3137" stroke="rgba(255,255,255,0.45)"/>
    </g>
    <g class="sans" text-anchor="middle">
      <text class="label" x="72" y="252">surface volume patch</text>
      <text class="sub" x="72" y="270">17 slices, 128×128 px</text>
    </g>

    <!-- input -> stem -->
    <path class="flow" d="M112,194 H136" marker-end="url(#arrowFlow)"/>

    <!-- ===== LOCAL 3D STEM ===== -->
    <!-- two 3D conv layers -->
    <rect class="box" x="140" y="140" width="150" height="108" rx="6"/>
    <g class="sans" text-anchor="middle">
      <text class="title" x="215" y="176">two 3D conv layers</text>
      <text class="label" x="215" y="198">3×3×3 kernels</text>
      <text class="label" x="215" y="214">16 channels</text>
      <text class="sub" x="215" y="232">InstanceNorm, LeakyReLU</text>
    </g>

    <!-- split into the two depth poolings -->
    <path class="wire" d="M290,194 H298 Q302,194 302,190 V162 Q302,158 306,158 H312" marker-end="url(#arrowWire)"/>
    <path class="wire" d="M302,194 V226 Q302,230 306,230 H312" marker-end="url(#arrowWire)"/>

    <!-- what the poolings do -->
    <text class="sans label" x="394" y="116" text-anchor="middle">pool over depth: 3D features → 2D map</text>

    <!-- attention pooling -->
    <rect class="box" x="316" y="128" width="156" height="60" rx="6"/>
    <g class="sans" text-anchor="middle">
      <text class="label" x="394" y="148" fill="#E6E8EA">attention pooling</text>
      <text class="sub" x="394" y="165">weighted sum over depth</text>
      <text class="sub" x="394" y="181">learned softmax weights</text>
    </g>

    <!-- max pooling -->
    <rect class="box" x="316" y="200" width="156" height="60" rx="6"/>
    <g class="sans" text-anchor="middle">
      <text class="label" x="394" y="220" fill="#E6E8EA">max pooling</text>
      <text class="sub" x="394" y="237">maximum over depth</text>
      <text class="sub" x="394" y="253">keeps the strongest response</text>
    </g>

    <!-- merge: concatenate the two 16-channel maps -->
    <path class="wire" d="M472,158 H478 Q482,158 482,162 V190 Q482,194 486,194 H488"/>
    <path class="wire" d="M472,230 H478 Q482,230 482,226 V194"/>
    <circle cx="488" cy="194" r="2.4" fill="rgba(255,255,255,0.6)"/>
    <path class="flow" d="M490,194 H561" marker-end="url(#arrowFlow)"/>
    <g class="sans" text-anchor="middle">
      <text class="label" x="525" y="181">concatenate</text>
      <text class="sub" x="525" y="213">32 channels</text>
    </g>

    <!-- ===== 2D U-NET ===== -->
    <!-- encoder: 128² 32 ch, 64² 64, 32² 128, 16² 256, 8² 320 -->
    <rect class="enc" x="565" y="144" width="8" height="100" rx="2"/>
    <rect class="enc" x="579" y="152" width="10" height="84" rx="2"/>
    <rect class="enc" x="595" y="160" width="12" height="68" rx="2"/>
    <rect class="enc" x="613" y="168" width="14" height="52" rx="2"/>
    <rect class="enc" x="633" y="176" width="16" height="36" rx="2"/>
    <!-- bottleneck: 4² 320 ch -->
    <rect class="enc" x="655" y="183" width="16" height="22" rx="2"/>
    <!-- decoder: 8² 320, 16² 256, 32² 128, 64² 64, 128² 32 -->
    <rect class="dec" x="677" y="176" width="16" height="36" rx="2"/>
    <rect class="dec" x="699" y="168" width="14" height="52" rx="2"/>
    <rect class="dec" x="719" y="160" width="12" height="68" rx="2"/>
    <rect class="dec" x="737" y="152" width="10" height="84" rx="2"/>
    <rect class="dec" x="753" y="144" width="8" height="100" rx="2"/>

    <!-- skip connections: each encoder stage feeds the decoder stage at the same resolution -->
    <path class="skip" d="M641,176 V171 Q641,166 646,166 H680 Q685,166 685,171 V173" marker-end="url(#arrowSkip)"/>
    <path class="skip" d="M620,168 V159 Q620,154 625,154 H701 Q706,154 706,159 V165" marker-end="url(#arrowSkip)"/>
    <path class="skip" d="M601,160 V147 Q601,142 606,142 H720 Q725,142 725,147 V157" marker-end="url(#arrowSkip)"/>
    <path class="skip" d="M584,152 V135 Q584,130 589,130 H737 Q742,130 742,135 V149" marker-end="url(#arrowSkip)"/>
    <path class="skip" d="M569,144 V123 Q569,118 574,118 H752 Q757,118 757,123 V141" marker-end="url(#arrowSkip)"/>
    <text class="sans sub" x="663" y="112" text-anchor="middle">skip connections</text>

    <!-- U-Net annotations -->
    <text class="sans sub" x="663" y="234" text-anchor="middle">4×4, 320 channels</text>
    <g class="sans sub" text-anchor="middle">
      <text x="663" y="284">6 stages, residual conv blocks</text>
      <text x="663" y="300">encoder: strided conv halves the resolution</text>
      <text x="663" y="316">decoder: transposed conv doubles it back</text>
    </g>

    <!-- U-Net -> output -->
    <path class="flow" d="M763,194 H795" marker-end="url(#arrowFlow)"/>

    <!-- ===== OUTPUT: ink probability map (crop of a real prediction) ===== -->
    <rect x="799" y="166" width="56" height="56" rx="3" fill="#0E0F11"/>
    <image clip-path="url(#outClip)" x="799" y="166" width="56" height="56"
           preserveAspectRatio="xMidYMid slice"
           href="data:image/webp;base64,"/>
    <rect x="799" y="166" width="56" height="56" rx="3" fill="none" stroke="rgba(255,255,255,0.40)"/>
    <g class="sans" text-anchor="middle">
      <text class="label" x="827" y="252">ink probability map</text>
      <text class="sub" x="827" y="270">one value per pixel</text>
      <text class="sub" x="827" y="288">1×1 conv, then sigmoid</text>
    </g>
  </g>

  <!-- tensor shapes under each stage -->
  <g class="mono shape" text-anchor="middle">
    <text x="72" y="312">1 × 17 × 128 × 128</text>
    <text x="215" y="312">16 × 17 × 128 × 128</text>
    <text x="525" y="312">32 × 128 × 128</text>
    <text x="827" y="312">1 × 128 × 128</text>
  </g>
  <text class="sans sub" x="450" y="338" text-anchor="middle">tensor shapes: channels × depth (slices) × height × width</text>
</svg>
