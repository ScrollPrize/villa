[pytest]
addopts = -p no:napari -m "not slow and not network"
# tests import helpers as the `tests` package (tests/zarr_utils.py), whichever way pytest is launched.
pythonpath = .
markers =
    slow: tests that take more than a few seconds
    network: tests that require network access (S3/HTTPS)
    cuda: requires a GPU-manager grant and an available CUDA device
