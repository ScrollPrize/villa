[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesuvius"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
]
# Minimal core dependencies.
dependencies = [
    "numpy>=2.0.2",
    "pillow>=11.3.0",
    "pynrrd>=1.1.3",
    "pyyaml>=6.0.2",
    "cachetools>=6.2.4",
]

[project.optional-dependencies]
# Minimal install explicitly named
volume-only = [
    "vc-reader",
    "numpy>=2.0.2",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
]
# Machine-learning & training stack
models = [
    "torch>=2.12,<3",
    "accelerate>=1.13.0",
    "pytorch-optimizer>=3.8.0",
    "huggingface-hub>=0.35.0",
    "timm>=1.0.20",
    "nnunetv2>=2.8.1,<2.9",
    "torchvision>=0.27",
    # Monorepo-only C++ package (resolved via [tool.uv.sources]); provides the vc /
    # vc3d bindings imported by vesuvius.neural_tracing. Not on PyPI, so it must stay
    # out of the base dependencies to keep `pip install vesuvius[volume-only]` working.
    "volume-cartographer",
    # Monorepo-only C++ package like volume-cartographer; the fiber tracers and
    # fiber_trace_3d read and write fibers through its object store.
    "vc-object-store",
    # Monorepo-only C++ package: Zarr, TIFF and catalog reading, sampling, transforms.
    "vc-reader",
    "villa-gpu-manager",
    "numba>=0.60.0",
    "einops>=0.8.1",
    "scikit-image>=0.24.0",
    "scipy>=1.13.1",
    "tqdm>=4.67.1",
    "wandb[media]>=0.22.0",
    "psutil>=7.1.0",
    "click>=8.1",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "scikit-learn>=1.5",

    # Data pipeline / I/O and compression
    "fastremap>=1.15",
    "opencv-python-headless>=4.11.0.86",
]
# Rendering and geometry utilities
render = [
    "vc-reader",
    "opencv-python-headless>=4.11.0.86",
    "alphashape>=1.3.1",
    "shapely>=2.0",
]
# Graphical user interface and visualisation
gui = [
    "napari>=0.5.6",
    "magicgui>=0.10.1",
    "pyqt6",
]

# Notebooks
notebooks = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "matplotlib",
]

# Blending and finalization (minimal dependencies for vesuvius.blend_logits and vesuvius.finalize_outputs)
blending = [
    "vc-reader",
    "scipy>=1.13.1",       # For scipy.ndimage.gaussian_filter in blending.py
    "tqdm>=4.67.1",        # Progress bars
]

# tifffile checks written TIFFs independently of vc_reader.
tests = ["pytest>=8.4.2", "tifffile>=2024.8.30"]

# Geometry-driven TIFXYZ label production (no torch/GUI dependency)
label-transfer = [
    "vc-reader",
    "scipy>=1.13.1",
]

# Convenience alias to install everything
all = [
    # Machine-learning & training stack
    "torch>=2.12,<3",
    "accelerate>=1.13.0",
    "pytorch-optimizer>=3.8.0",
    "huggingface-hub>=0.35.0",
    "timm>=1.0.20",
    "numba>=0.60.0",
    "nnunetv2>=2.8.1,<2.9",
    "torchvision>=0.27",
    "volume-cartographer",  # monorepo-only, see the note in [project.optional-dependencies.models]
    "vc-object-store",  # monorepo-only, see the note in [project.optional-dependencies.models]
    "vc-reader",  # monorepo-only until published
    "villa-gpu-manager",
    "einops>=0.8.1",
    "scikit-image>=0.24.0",
    "scipy>=1.13.1",
    "tqdm>=4.67.1",
    "wandb[media]>=0.22.0",
    "psutil>=7.1.0",
    "click>=8.1",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "scikit-learn>=1.5",

    # Rendering and geometry utilities
    "opencv-python-headless>=4.11.0.86",
    "alphashape>=1.3.1",
    "shapely>=2.0",

    # GUI and visualisation
    "napari>=0.5.6",
    "magicgui>=0.10.1",
    "pyqt6",

    # Development / build tooling
    "build",
    "pybind11>=3.0.1",
    "setuptools>=80.9.0",
    "wheel",

    # Tests
    "pytest>=8.4.2",
    "tifffile>=2024.8.30",

    # Data pipeline / I/O and compression
    "fastremap>=1.15",
]

[project.urls]
Homepage = "https://github.com/ScrollPrize/villa"

[project.scripts]
"vesuvius.predict" = "vesuvius.models.run.inference:main"
"vesuvius.blend_logits" = "vesuvius.models.run.blending:main"
"vesuvius.blend_and_finalize" = "vesuvius.models.run.blending:blend_and_finalize_main"
"vesuvius.finalize_outputs" = "vesuvius.models.run.finalize_outputs:main"
"vesuvius.compute_st" = "vesuvius.structure_tensor.run_create_st:main"
"vesuvius.napari_trainer" = "vesuvius.napari_trainer.main_window:main"
"vesuvius.voxelize_obj" = "vesuvius.label_processing.voxelize_objs:main"
"vesuvius.refine_labels" = "vesuvius.label_processing.refine_labels:main"
"vesuvius.train" = "vesuvius.models.training.train:main"
"vesuvius.find_patches" = "vesuvius.models.preprocessing.patches.cli:main"
"vesuvius.fiber_spline_generator" = "vesuvius.fiber_spline_generator.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vesuvius = [
    "install/configs/cubes.yaml",
    "ink_detection/configs/*.json",
    "tifxyz_label_transfer/*.cpp",
    "tifxyz_label_transfer/*.md",
    "tifxyz_label_transfer/docs/*.md",
    "fiber_spline_generator/extend/*.pt",
]

[tool.setuptools.dynamic]
version = {attr = "vesuvius._version.VERSION"}

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
volume-cartographer = { path = "../volume-cartographer", editable = true }
vc-object-store = { path = "../vc_object_store", editable = true }
vc-reader = { path = "../vc_reader", editable = true }
villa-gpu-manager = { path = "../gpu_manager", editable = true }
