[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dinovol-2"
version = "0.1.0"
description = "3d adaptation of dinov2 pretraining for larger than memory ome-zarr arrays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops",
    "numpy>=2.4.3",
    "pillow>=12.1.1",
    "scikit-image",
    "scipy",
    "timm==1.0.20",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
    "vc-reader",  # monorepo-only until published
]

[tool.uv.sources]
vc-reader = { path = "../vc_reader", editable = true }

[tool.setuptools.packages.find]
include = ["dinovol_2*"]
