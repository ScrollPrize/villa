[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dinovol-2"
version = "0.1.0"
description = "3d adaptation of dinov2 pretraining for larger than memory ome-zarr arrays"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops",
    "numpy>=2.4.3",
    "pillow>=12.1.1",
    "scikit-image",
    "scipy",
    "setuptools",  # torch.compile / Inductor runtime
    "timm==1.0.20",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
    "tifffile>=2026.3.3",
    "imagecodecs>=2026.3.6",
    "numcodecs>=0.16.5",
    "vc-reader[reader,transforms,torch]",  # monorepo-only until published
]

[tool.setuptools.packages.find]
include = ["dinovol_2*"]

[tool.uv.sources]
vc-reader = { path = "../vc_reader", editable = true }

[tool.uv.config-settings-package]
vc-reader = { "cmake.define.VC_READER_ENABLE_CUDA" = "ON", "cmake.define.CMAKE_CUDA_ARCHITECTURES" = "native" }
