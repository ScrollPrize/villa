[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "vc_tomography"
version = "0.1.0"
description = "Compact helical (extended-FOV) tomography reconstruction: C++ core, CPU + CUDA kernels, nanobind bindings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "h5py>=3.8", "tifffile", "vc-reader"]

[project.scripts]
vc_tomography_download_projections = "vc_tomography.download_projections:main"

[project.optional-dependencies]
test = ["pytest", "tifffile", "h5py", "hdf5plugin"]
denoise = ["torch>=2.12,<3"]

[tool.uv.sources]
vc-reader = { path = "../../vc_reader" }

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/vc_tomography"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
VC_TOMOGRAPHY_CUDA = "AUTO"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
