[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "volume-cartographer"
version = "3.0.3"
description = "Python bindings for Volume Cartographer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
]
license = { file = "LICENSE" }

[project.scripts]
vc_fiberlets = "vc.fiberlets_cli:main"

[tool.scikit-build]
cmake.version = ">=3.22"
wheel.packages = []

[tool.scikit-build.cmake.define]
VC_BUILD_PYTHON = "ON"
VC_BUILD_APPS = "OFF"
VC_BUILD_FIBERLETS = "ON"
VC_BUILD_FLATBOI = "OFF"
VC_TESTING = "OFF"

# Editable installs copy the compiled modules and Python files once; rebuild them on
# `uv sync` whenever the sources of the Python build change (including the object
# store core it compiles in).
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cmake/**" },
    { file = "core/**/*.{c,cpp,h,hpp,cu,cuh,in,txt}" },
    { file = "utils/**/*.{c,cpp,h,hpp,cu,cuh,in,txt}" },
    { file = "libs/**/*.{c,cpp,h,hpp,cu,cuh,in,txt}" },
    { file = "apps/CMakeLists.txt" },
    { file = "apps/src/**" },
    { file = "python/**/*.{cpp,hpp,py,txt}" },
    { file = "../vc_object_store/CMakeLists.txt" },
    { file = "../vc_object_store/cmake/**" },
    { file = "../vc_object_store/include/**" },
    { file = "../vc_object_store/src/**" },
]
