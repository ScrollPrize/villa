[project]
name = "spiral"
version = "0.1.0"
description = "Code and helpers to fit a canonical archimedean spiral to deformed scrolls"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "crackle-codec>=0.42.0",
    # 3.1.1 (kimimaro's lock) mishandles boundary-free scanlines: inf poisons the
    # Felzenszwalb passes and corrupts long air runs; make_surf_sdt refuses < 3.1.2.
    "edt>=3.1.2",
    "einops>=0.8.2",
    "imageio>=2.37.3",
    "kimimaro[all]>=5.8.1",
    "kornia>=0.8.3",
    "libigl>=2.6.1",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "numpy>=2.5.0",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
    "posix-ipc>=1.3.2; sys_platform != 'win32'",
    "pyro-ppl>=1.9.1",
    "rustworkx>=0.18.0",
    "s3fs>=2026.6.0",
    "scipy>=1.18.0",
    "tifffile>=2026.6.1",
    "tensorstore>=0.1.80",
    "threadpoolctl>=3.6.0",
    "torch>=2.11,<2.13",
    "torchdiffeq>=0.2.5",
    "tqdm>=4.68.3",
    "trimesh>=4.12.2",
    "vc-delta3d>=0.1.0,<0.2",
    "wandb>=0.28.0",
    "zarr>=3.2.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.version = ">=3.22"
wheel.packages = ["vc_spiral"]
