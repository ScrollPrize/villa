[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.10.2"]
build-backend = "scikit_build_core.build"

[project]
name = "vc-reader"
version = "0.1.0"
description = "Find and locate Vesuvius Challenge open data from its published metadata.json"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
# The catalog layer is stdlib-only. The reader is the native extension built
# from cpp/ (see CMakeLists.txt) plus numpy.
dependencies = []

[project.optional-dependencies]
reader = ["numpy>=1.24"]
augment = ["numpy>=1.24"]

[project.scripts]
vc-reader = "vc_reader.cli:main"

[tool.scikit-build]
# The native read path (cpp/, module vc_reader._native); see CMakeLists.txt for system deps.
minimum-version = "build-system.requires"
wheel.packages = ["src/vc_reader"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
# Keep local development artifacts out of source releases if regenerated.
sdist.exclude = ["benchmarks/results/**", "tests/**", "elastic_comparison/**"]
