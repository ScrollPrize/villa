[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-reader"
version = "0.1.0"
description = "Find and locate Vesuvius Challenge open data from its published metadata.json"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
# The catalog layer is stdlib-only; readers need the `reader` extra.
dependencies = []

[project.optional-dependencies]
reader = [
    "numpy>=1.24",
    "urllib3>=2",
    "numcodecs>=0.12",
    # VC3D Delta3D caches. 0.1.1 releases the GIL while decoding, so chunks decode in parallel.
    "vc-delta3d>=0.1.1; python_version >= '3.12'",
]
# Baselines for benchmarks/ (TensorStore is optional there).
bench = ["vc-reader[reader]", "zarr>=3", "s3fs", "tensorstore"]
test = ["vc-reader[reader]", "pytest>=8"]

[project.scripts]
vc-reader = "vc_reader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = ["network: tests that fetch the live metadata.json"]
