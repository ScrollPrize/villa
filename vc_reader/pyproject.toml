[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "vc-reader"
version = "0.1.0"
description = "Find and locate Vesuvius Challenge open data from its published metadata.json"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
# The catalog layer is stdlib-only. The reader is the native extension built
# from cpp/ (see CMakeLists.txt) plus numpy.
dependencies = []

[project.optional-dependencies]
reader = ["numpy>=1.24"]
# Baselines for benchmarks/.
bench = ["vc-reader[reader]", "zarr>=3", "s3fs", "tensorstore"]
# numcodecs and vc-delta3d write the tests' blosc and Delta3D fixtures.
test = ["vc-reader[reader]", "pytest>=8", "numcodecs>=0.12", "vc-delta3d>=0.1.1; python_version >= '3.12'"]

[project.scripts]
vc-reader = "vc_reader.cli:main"

[tool.scikit-build]
# The native read path (cpp/, module vc_reader._native); see CMakeLists.txt for system deps.
minimum-version = "build-system.requires"
wheel.packages = ["src/vc_reader"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = ["network: tests that fetch the live metadata.json"]
