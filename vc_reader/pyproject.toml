[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-reader"
version = "0.1.0"
description = "Find and locate Vesuvius Challenge open data from its published metadata.json"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
# The catalog layer is stdlib-only. Streaming of zarr/tif/png data will add
# optional extras.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vc-reader = "vc_reader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = ["network: tests that fetch the live metadata.json"]
