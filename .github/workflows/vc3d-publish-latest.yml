name: Publish VC3D latest release

on:
  workflow_run:
    workflows:
      - VC3D Windows Installer
      - VC3D macOS App
      - VC3D Linux AppImage
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: vc3d-publish-latest
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested packages
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find both successful package runs
        shell: bash
        run: |
          set -euo pipefail

          find_package_run() {
            local workflow="$1"
            local artifact="$2"
            local run_ids
            local artifact_id

            run_ids="$(gh run list \
              --workflow "$workflow" \
              --commit "$PACKAGE_SHA" \
              --event push \
              --status success \
              --limit 10 \
              --json databaseId \
              --jq '.[].databaseId')"

            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              artifact_id="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" \
                --jq ".artifacts | map(select(.name == \"$artifact\" and .expired == false)) | first | .id // empty")"
              if [[ -n "$artifact_id" ]]; then
                echo "$candidate"
                return 0
              fi
            done <<< "$run_ids"
          }

          windows_run="$(find_package_run vc3d-windows.yml VC3D-windows-installer)"
          macos_run="$(find_package_run vc3d-macos.yml VC3D-macos-app)"
          linux_run="$(find_package_run vc3d-linux.yml VC3D-linux-appimage)"

          # Each platform completion starts this coordinator. The earlier ones to
          # finish normally exit here; the last one sees every artifact and
          # publishes the complete release.
          if [[ -z "$windows_run" || -z "$macos_run" || -z "$linux_run" ]]; then
            echo "All platform packages are not ready for $PACKAGE_SHA yet."
            echo "PACKAGES_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "PACKAGES_READY=true" >> "$GITHUB_ENV"
          echo "WINDOWS_RUN_ID=$windows_run" >> "$GITHUB_ENV"
          echo "MACOS_RUN_ID=$macos_run" >> "$GITHUB_ENV"
          echo "LINUX_RUN_ID=$linux_run" >> "$GITHUB_ENV"

      - name: Ensure candidate advances latest
        if: env.PACKAGES_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force origin main
          if ! git merge-base --is-ancestor "$PACKAGE_SHA" origin/main; then
            echo "::error::$PACKAGE_SHA is not on main"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin refs/tags/latest \
              >/dev/null 2>&1; then
            git fetch --force origin refs/tags/latest:refs/tags/latest
            current_latest="$(git rev-parse 'refs/tags/latest^{commit}')"

            if [[ "$current_latest" == "$PACKAGE_SHA" ]]; then
              # Even six *new* assets are insufficient proof that the previous
              # release survived. Require the signed-up archive receipt on the
              # moving annotated tag and verify all six archived IDs first.
              replay="$(python3 .github/scripts/vc3d_archive_zero_copy.py latest "$PACKAGE_SHA")"
              printf '%s\n' "$replay"
              replay_status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$replay")"
              case "$replay_status" in
                ALREADY_PUBLISHED|BOOTSTRAPPED_UNCHANGED)
                  echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV" ;;
                REPAIR_RELEASE_ONLY)
                  echo "SKIP_PUBLISH=false" >> "$GITHUB_ENV"
                  echo "REPAIR_PUBLISH=true" >> "$GITHUB_ENV" ;;
                *)
                  echo "::error::unrecognized latest replay status: $replay_status"
                  exit 1 ;;
              esac
              exit 0
            fi

            if ! git merge-base --is-ancestor "$current_latest" "$PACKAGE_SHA"; then
              echo "A newer main package is already latest; refusing to move latest backward."
              echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          echo "SKIP_PUBLISH=false" >> "$GITHUB_ENV"

      - name: Download package artifacts
        if: env.PACKAGES_READY == 'true' && env.SKIP_PUBLISH != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir release-assets
          gh run download "$WINDOWS_RUN_ID" \
            --name VC3D-windows-installer \
            --dir release-assets
          gh run download "$MACOS_RUN_ID" \
            --name VC3D-macos-app \
            --dir release-assets
          gh run download "$LINUX_RUN_ID" \
            --name VC3D-linux-appimage \
            --dir release-assets

          shopt -s nullglob
          windows_exe=(release-assets/VC3D-*-win64.exe)
          windows_zip=(release-assets/VC3D-*-win64.zip)
          macos_dmg=(release-assets/VC3D-*-macos-*.dmg)
          macos_zip=(release-assets/VC3D-*-macos-*.zip)
          linux_appimage=(release-assets/VC3D-*.AppImage)
          linux_debug=(release-assets/VC3D-*-debug.tar.zst)

          if [[ ${#windows_exe[@]} -ne 1 ||
                ${#windows_zip[@]} -ne 1 ||
                ${#macos_dmg[@]} -ne 1 ||
                ${#macos_zip[@]} -ne 1 ||
                ${#linux_appimage[@]} -ne 1 ||
                ${#linux_debug[@]} -ne 1 ]]; then
            echo "::error::expected exactly one Windows installer, Windows ZIP, macOS DMG, macOS ZIP, Linux AppImage, and Linux debug tarball"
            find release-assets -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Archive previous latest release (preserves six asset IDs)
        if: env.PACKAGES_READY == 'true' && env.SKIP_PUBLISH != 'true' && env.REPAIR_PUBLISH != 'true'
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(python3 .github/scripts/vc3d_archive_zero_copy.py latest "$PACKAGE_SHA")"
          printf '%s\n' "$receipt"
          echo "ARCHIVE_REF=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["archive"])' <<< "$receipt")" >> "$GITHUB_ENV"
          echo "EXPECTED_OLD_TAG_OID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["old_tag_object"])' <<< "$receipt")" >> "$GITHUB_ENV"
          echo "ARCHIVED_RELEASE_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["release_id"])' <<< "$receipt")" >> "$GITHUB_ENV"
          echo "ARCHIVED_ASSET_IDS=$(python3 -c 'import json,sys; print(",".join(map(str,json.load(sys.stdin)["asset_ids"])))' <<< "$receipt")" >> "$GITHUB_ENV"

      - name: Move latest tag and publish release
        if: env.PACKAGES_READY == 'true' && env.SKIP_PUBLISH != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${REPAIR_PUBLISH:-false}" == 'true' ]]; then
            # Crash recovery: latest already moved, so pushing the tag again is
            # both unnecessary and unsafe. Recheck the complete archive receipt
            # immediately before recreating the missing GitHub release.
            replay="$(python3 .github/scripts/vc3d_archive_zero_copy.py latest "$PACKAGE_SHA")"
            replay_status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$replay")"
            case "$replay_status" in
              REPAIR_RELEASE_ONLY) ;;
              ALREADY_PUBLISHED)
                echo "Latest release was restored concurrently; no change needed."
                exit 0 ;;
              *)
                echo "::error::latest replay receipt no longer authorizes repair: $replay_status"
                exit 1 ;;
            esac
          else
            bash .github/scripts/vc3d_atomic_prestage.sh \
              latest "$PACKAGE_SHA" "$EXPECTED_OLD_TAG_OID" \
              "$ARCHIVE_REF" "$ARCHIVED_RELEASE_ID" "$ARCHIVED_ASSET_IDS"
          fi

          # Even after atomic prestage, another actor can move latest before
          # gh release create; --verify-tag checks existence, not source SHA.
          # Only the exact staged/archived receipt permits this upload.
          replay="$(python3 .github/scripts/vc3d_archive_zero_copy.py latest "$PACKAGE_SHA" --probe-only)"
          replay_status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$replay")"
          case "$replay_status" in
            REPAIR_RELEASE_ONLY) ;;
            ALREADY_PUBLISHED)
              echo "Latest release was published concurrently; skip duplicate."
              exit 0 ;;
            *) echo "::error::latest publication receipt changed: $replay_status" >&2; exit 1 ;;
          esac

          # Archive step preserves old assets and their release ID without reupload.
          # The stable channel remains GitHub's designated latest release.
          gh release create latest release-assets/* \
            --verify-tag \
            --title "VC3D Latest" \
            --notes "Automatically packaged from main at commit $PACKAGE_SHA." \
            --prerelease \
            --latest=false
