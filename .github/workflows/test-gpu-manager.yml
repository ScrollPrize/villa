name: Cooperative GPU manager

on:
  pull_request:
    paths:
      - "gpu_manager/**"
      - ".github/workflows/test-gpu-manager.yml"
  push:
    branches: [main]
    paths:
      - "gpu_manager/**"
      - ".github/workflows/test-gpu-manager.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install standalone test dependencies
        run: python -m pip install -e './gpu_manager[test]'
      - name: Test CPU-only protocol and process lifecycle
        run: python -m pytest -q gpu_manager/tests --durations=10 --basetemp=/tmp/vgm-tests
