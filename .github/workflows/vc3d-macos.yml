name: VC3D macOS App
run-name: VC3D macOS ${{ github.event_name }} ${{ inputs.request_id || github.sha }}

# Builds VC3D natively on macOS (Apple Silicon) with the Homebrew LLVM
# toolchain and produces a self-contained VC3D.app — full dylib closure and
# Qt plugins bundled via macdeployqt, everything ad-hoc signed — wrapped in a
# drag-and-drop DMG by CPack, with a ZIP derived from that deployed bundle. On
# published releases both are attached to the GitHub release.
#
# The python-tools job builds the Python tools for that app as prebuilt wheels
# (.github/mac-app), with hash-pinned locks, the villa sources they run from and
# the installer, which the app ships in Contents/Resources and runs when a
# feature first needs its Python environment. Those files go out with the app,
# as the VC3D-macos-python-tools artifact, to every release the app goes to.
#
# With the Apple secrets below, the app and the DMG are signed with a Developer
# ID and notarized (.github/mac-app/sign-macos.sh). Without them the app stays
# ad-hoc signed: downloads are Gatekeeper-quarantined, so the first launch is
# right-click -> Open (or `xattr -dr com.apple.quarantine VC3D.app`).
#   MACOS_CERTIFICATE_P12        base64 of a .p12 with the Developer ID
#                                Application certificate and its key
#   MACOS_CERTIFICATE_PASSWORD   that .p12's password
#   NOTARY_API_KEY               an App Store Connect API key (.p8 contents)
#   NOTARY_API_KEY_ID            its key ID
#   NOTARY_API_ISSUER_ID         its issuer ID
#
# Binaries link Homebrew bottles built for the runner's macOS release, so the
# package effectively requires that macOS major version or newer (recorded as
# LSMinimumSystemVersion in the app's Info.plist).

on:
  # Keep the existing workflow check present on PRs, but satisfy it with a
  # lightweight no-op; vc3d-ci owns the required native macOS compile gate.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'volume-cartographer/**'
      - '.github/workflows/vc3d-macos.yml'
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit to package (defaults to the selected workflow ref)
        required: false
        type: string
      request_id:
        description: Optional caller correlation ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer main build supersedes an older package build. Never cancel a
  # release or an explicitly requested build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  pr-noop:
    name: Build + package (Homebrew LLVM, arm64)
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - run: echo "Native compile coverage is provided by the required vc3d-ci macOS job."

  # A failure here doesn't fail the run: build-macos then packages the app
  # without the installer, which offers no Python tools install, and the
  # publish workflows publish it without them
  python-tools:
    name: Python tools (arm64)
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 180
    continue-on-error: true
    outputs:
      ready: ${{ steps.uploaded.outputs.ready }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      # the app's floor: MacPackaging.cmake records the runner's major version as
      # LSMinimumSystemVersion, so the wheels target it and the installer refuses
      # what the app refuses
      - name: Choose the macOS floor
        run: echo "MIN_MACOS=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"

      # the wheels build with Apple clang, and the C++ uses std::jthread, which
      # libc++ before 20 only offers as experimental (Xcode 16.4's does): take the
      # newest Xcode, and the experimental library only if it still needs it
      - name: Choose the Xcode
        run: |
          export MACOSX_DEPLOYMENT_TARGET="$MIN_MACOS"
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -v -i -E "beta|release_candidate" | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          /usr/bin/clang++ --version | head -1
          probe="$RUNNER_TEMP/jthread.cpp"
          printf '#include <stop_token>\n#include <thread>\nint main() { std::jthread t([](std::stop_token) {}); }\n' > "$probe"
          if /usr/bin/clang++ -std=c++20 "$probe" -o "$RUNNER_TEMP/jthread"; then
            echo "$xcode has std::jthread"
          elif /usr/bin/clang++ -std=c++20 -fexperimental-library "$probe" -o "$RUNNER_TEMP/jthread"; then
            echo "$xcode has std::jthread with -fexperimental-library"
            echo "CXXFLAGS=-fexperimental-library" >> "$GITHUB_ENV"
          else
            echo "::error::no std::jthread in $xcode for macOS $MACOSX_DEPLOYMENT_TARGET"; exit 1
          fi
          "$RUNNER_TEMP/jthread"

      # the formulae scripts/build_macos.sh installs (the vc bindings build the
      # same C++ tree), plus uv
      - name: Install build dependencies
        run: |
          brew install uv cmake ninja pkgconf ceres-solver eigen opencv c-blosc c-blosc2 concurrentqueue zstd lz4 boost \
            libtiff libpng jpeg-turbo curl nlohmann-json sqlite openssl@3 lapack openblas libomp scotch hwloc gcc flang \
            qtbase
          uv python install 3.14.10

      - name: Build a static OpenCV
        run: MACOSX_DEPLOYMENT_TARGET="$MIN_MACOS" .github/mac-app/build-opencv.sh "$RUNNER_TEMP/opencv" "$(sysctl -n hw.ncpu)"

      # every torch the locks pin: the wheels must load the libomp each ships
      - name: Get torch's OpenMP runtimes
        run: |
          libomps=()
          for version in $(grep -h '^torch==' .github/mac-app/lock-inputs/*.in | cut -d= -f3 | sort -u); do
            uv venv --quiet --python 3.14.10 "$RUNNER_TEMP/torch-$version"
            uv pip install --quiet --python "$RUNNER_TEMP/torch-$version/bin/python" "torch==$version"
            libomps+=("$RUNNER_TEMP/torch-$version/lib/python3.14/site-packages/torch/lib/libomp.dylib")
          done
          ls -la "${libomps[@]}"
          echo "TORCH_LIBOMPS=${libomps[*]}" >> "$GITHUB_ENV"

      - name: Build the wheels
        env:
          OCV: ${{ runner.temp }}/opencv
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/src"
          MACOSX_DEPLOYMENT_TARGET="$MIN_MACOS" /usr/bin/time -l .github/mac-app/build-wheels.sh "$RUNNER_TEMP/src" \
            "$RUNNER_TEMP/wheels-build" "$(sysctl -n hw.ncpu)"

      - name: Assemble the release files
        run: |
          .github/mac-app/make-assets.sh . "$RUNNER_TEMP/wheels-build/wheels" "$RUNNER_TEMP/python-tools" \
            "$GITHUB_REPOSITORY" "$MIN_MACOS"
          ls -la "$RUNNER_TEMP/python-tools"

      # the installer as a user runs it: no Homebrew, only the system's tools on
      # PATH, a fresh home, and the release files from this run
      - name: Install the Python tools with Homebrew hidden
        timeout-minutes: 45
        run: |
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          tools="$home/Library/Application Support/Vesuvius Challenge/VC3D/python-tools"
          installer="$RUNNER_TEMP/python-tools/VC3D-macos-python-tools.sh"
          sudo mv /opt/homebrew /opt/homebrew.hidden
          trap 'sudo mv /opt/homebrew.hidden /opt/homebrew' EXIT
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin bash "$installer"
          check=.github/mac-app/omp_check.py
          env -i HOME="$home" "$tools/envs/lasagna/bin/python" -I $check vc.volume vc.fiber_trace vc_lasagna_amgx \
            vc_reader vc_object_store
          env -i HOME="$home" "$tools/envs/spiral/bin/python" -I $check vc_spiral.spiral_sampling vc_spiral.track_store \
            vc_reader vc_object_store posix_ipc
          env -i HOME="$home" "$tools/envs/vesuvius/bin/python" -I $check vc_reader vc_object_store
          # and again: nothing left to do
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin bash "$installer" | tee "$RUNNER_TEMP/second.log"
          [[ $(grep -c 'already up to date' "$RUNNER_TEMP/second.log") -eq 3 ]]

      - uses: actions/upload-artifact@v4
        with:
          name: VC3D-macos-python-tools
          path: ${{ runner.temp }}/python-tools
          if-no-files-found: error

      - id: uploaded
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build + package (Homebrew LLVM, arm64)
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: python-tools
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 180
    env:
      AGENTS_AGENT_MODE: '1'
      AGENTS_ALLOW_INSTALL: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_C_CUSTOM_CACHE_BUSTER: vc3d-macos-15-arm64-homebrew-native-v1
    defaults:
      run:
        working-directory: volume-cartographer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0

      # the installer made for this commit's wheels, which the app bundle ships
      - name: Download the Python tools installer
        if: needs.python-tools.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: VC3D-macos-python-tools
          path: ${{ runner.temp }}/python-tools

      - name: Install Homebrew dependencies + build
        env:
          PYTHON_TOOLS_READY: ${{ needs.python-tools.outputs.ready }}
        run: |
          if [[ $PYTHON_TOOLS_READY == true ]]; then
            export VC_MACOS_PYTHON_TOOLS_INSTALLER="$RUNNER_TEMP/python-tools/VC3D-macos-python-tools.sh"
          else
            echo "::warning::the Python tools failed to build, so this app ships without their installer"
          fi
          ./scripts/build_macos.sh --install-deps --sccache

      - name: Package (DMG + ZIP)
        run: |
          cd build-macos
          cpack -V -G DragNDrop

          # CPack stages and installs once per generator. Derive the ZIP from
          # the completed DMG so macdeployqt and install-name rewriting run
          # only once while both artifacts contain the exact same app bundle.
          shopt -s nullglob
          dmgs=(VC3D-*-macos-*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "::error::expected exactly one packaged DMG, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          zip="${dmg%.dmg}.zip"
          mountpoint="$RUNNER_TEMP/vc3d-package"
          mkdir -p "$mountpoint"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          ditto -c -k --sequesterRsrc --keepParent \
            "$mountpoint/VC3D.app" "$zip"
          hdiutil detach "$mountpoint"
          trap - EXIT

          ls -la VC3D-*-macos-*.dmg VC3D-*-macos-*.zip

      # a temporary keychain with the Developer ID certificate and the notary key
      # in a file, both removed after signing; nothing happens without the secrets
      - name: Set up Developer ID signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          given=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            [[ -n ${!name} ]] && given=$((given + 1))
          done
          if [[ $given -eq 0 ]]; then
            echo "::notice::No Apple signing secrets: the app stays ad-hoc signed and is not notarized"
            exit 0
          fi
          [[ $given -eq 5 ]] || { echo "::error::set all five Apple signing secrets, or none"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # keep the user's keychains in the search list after this one
          read -r -a keychains <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [[ -n $identity ]] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "SIGN_IDENTITY=$identity"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Sign and notarize (DMG + ZIP)
        if: env.SIGN_IDENTITY != ''
        working-directory: volume-cartographer/build-macos
        run: |
          dmg=$(echo VC3D-*-macos-*.dmg)
          ../../.github/mac-app/sign-macos.sh "$dmg" "${dmg%.dmg}.zip"

      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8"
          if [[ -f "$RUNNER_TEMP/signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: VC3D-macos-app
          path: |
            volume-cartographer/build-macos/VC3D-*-macos-*.dmg
            volume-cartographer/build-macos/VC3D-*-macos-*.zip
          if-no-files-found: error

      # Prove the bundle is self-contained: check no absolute Homebrew or
      # build-tree paths survived in any Mach-O, then hide the entire Homebrew
      # prefix and run binaries out of the DMG-installed app, so any dylib
      # missing from the bundle fails loudly here instead of on a user's Mac.
      - name: Smoke test packaged app
        timeout-minutes: 15
        working-directory: volume-cartographer/build-macos
        env:
          PYTHON_TOOLS_READY: ${{ needs.python-tools.outputs.ready }}
        run: |
          hdiutil attach VC3D-*-macos-*.dmg -nobrowse -readonly -mountpoint /tmp/vc3d-dmg
          cp -R /tmp/vc3d-dmg/VC3D.app smoke.app
          hdiutil detach /tmp/vc3d-dmg
          bin="$PWD/smoke.app/Contents/MacOS"
          installer=smoke.app/Contents/Resources/install-python-tools.sh
          if [[ $PYTHON_TOOLS_READY == true && ! -x $installer ]]; then
            echo "::error::the Python tools installer is missing from the bundle"
            exit 1
          fi
          if [[ $PYTHON_TOOLS_READY != true && -e $installer ]]; then
            echo "::error::the bundle has a Python tools installer whose files weren't built"
            exit 1
          fi

          # Any absolute Homebrew/build-tree dependency path in the bundle
          # would resolve on this runner but not on a user's machine. Scan
          # every executable/dylib including framework binaries (no .dylib
          # suffix); otool noise on non-Mach-O files is discarded.
          leaks=$(find smoke.app -type f \( -perm +111 -o -name '*.dylib' \) \
                    -exec otool -L {} + 2>/dev/null \
                    | grep -E "$(brew --prefix)/|$GITHUB_WORKSPACE|/usr/local/" || true)
          if [[ -n "$leaks" ]]; then
            echo "::error::absolute dependency paths leaked into the bundle:"
            echo "$leaks"
            exit 1
          fi

          # otool -L does not show LC_RPATH. A bundled Homebrew library can
          # still load another copy from the host through an absolute rpath.
          rpath_leaks=$(find smoke.app -type f \( -perm +111 -o -name '*.dylib' \) \
                          -exec otool -l {} + 2>/dev/null \
                          | awk '/cmd LC_RPATH/ { getline; getline; print }' \
                          | grep -E "$(brew --prefix)/|$GITHUB_WORKSPACE|/usr/local/" || true)
          if [[ -n "$rpath_leaks" ]]; then
            echo "::error::absolute library search paths leaked into the bundle:"
            echo "$rpath_leaks"
            exit 1
          fi

          sudo mv /opt/homebrew /opt/homebrew.hidden
          trap 'sudo mv /opt/homebrew.hidden /opt/homebrew' EXIT

          # Console CLI tool: loads the vc_core/OpenCV/Ceres dylib closure.
          # No-args prints usage and exits 1; anything else means load failure.
          set +e
          "$bin/vc_tifxyz2obj"; rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 1 ]]; then
            echo "::error::vc_tifxyz2obj failed to start (exit $rc)"
            exit 1
          fi
          echo "vc_tifxyz2obj OK (exit $rc)"

          # GUI app: Homebrew's macOS Qt package ships the native Cocoa
          # platform plugin, not the offscreen plugin. --version exits without
          # showing a window while still exercising the packaged Qt framework
          # and native platform plugin lookup.
          set +e
          QT_QPA_PLATFORM=cocoa "$bin/VC3D" --version
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            echo "::error::VC3D --version failed (exit $rc); collecting startup diagnostics"
            # Keep Homebrew hidden during the diagnostic retry. LLDB prints
            # the crashing thread and loaded images even when the app never
            # reaches its own crash handler. Preserve the original failure.
            QT_QPA_PLATFORM=cocoa QT_DEBUG_PLUGINS=1 /usr/bin/xcrun lldb \
              --batch -o run -k 'thread backtrace all' -k 'image list' \
              -- "$bin/VC3D" --version || true
            exit "$rc"
          fi
          echo "VC3D --version OK"

      - name: Upload macOS crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VC3D-macos-crash-reports
          path: ~/Library/Logs/DiagnosticReports/VC3D*
          if-no-files-found: ignore

  release-macos:
    name: Attach macOS package to release
    if: ${{ !cancelled() && github.event_name == 'release' && needs.build-macos.result == 'success' }}
    needs: [python-tools, build-macos]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: VC3D-macos-app
          path: release-assets

      - name: Download the app's Python tools
        if: needs.python-tools.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: VC3D-macos-python-tools
          path: release-assets

      - name: Attach app to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "${{ github.event.release.tag_name }}" \
            release-assets/VC3D-*-macos-*.dmg \
            release-assets/VC3D-*-macos-*.zip \
            release-assets/VC3D-macos-python-tools* \
            release-assets/*.whl \
            --clobber
