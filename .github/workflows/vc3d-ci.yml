name: Continuous Integration (CI)

on:
  pull_request:
    types: [opened, synchronize]
  # Trusted main builds populate sccache entries that all subsequent PRs can
  # read. Caches written by pull_request runs are scoped to that PR's merge ref.
  push:
    branches: [main]
    paths:
      - 'volume-cartographer/**'
      - 'vc_object_store/**'
      - 'vc_reader/**'
      - '.github/workflows/vc3d-ci.yml'

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      vc: ${{ steps.filter.outputs.vc }}
      test_core: ${{ steps.filter.outputs.test_core }}
      test_specialized: ${{ steps.filter.outputs.test_specialized }}
      vc3d: ${{ steps.filter.outputs.vc3d }}
      cli: ${{ steps.filter.outputs.cli }}
      flatboi: ${{ steps.filter.outputs.flatboi }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - name: Checkout Villa
        id: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Retry checkout Villa
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            vc:
              - 'volume-cartographer/**'
              - 'vc_object_store/**'
              - 'vc_reader/**'
              - '.github/workflows/vc3d-ci.yml'
              - '.github/workflows/vc3d-macos.yml'
            test_core:
              - 'volume-cartographer/CMakeLists.txt'
              - 'volume-cartographer/CMakePresets.json'
              - 'volume-cartographer/scripts/**'
              - 'volume-cartographer/Dockerfile*'
              - 'volume-cartographer/cmake/**'
              - 'volume-cartographer/core/**'
              - 'volume-cartographer/apps/VC3D/**'
              - 'volume-cartographer/utils/**'
              - 'volume-cartographer/libs/**'
              - 'vc_object_store/**'
              - 'vc_reader/**'
              - '.github/workflows/vc3d-ci.yml'
            test_specialized:
              - 'volume-cartographer/CMakeLists.txt'
              - 'volume-cartographer/CMakePresets.json'
              - 'volume-cartographer/scripts/**'
              - 'volume-cartographer/Dockerfile*'
              - 'volume-cartographer/cmake/**'
              - 'volume-cartographer/core/**'
              - 'volume-cartographer/apps/VC3D/**'
              - 'volume-cartographer/utils/**'
              - 'volume-cartographer/libs/**'
              - 'vc_object_store/**'
              - 'vc_reader/**'
              - '.github/workflows/vc3d-ci.yml'
            vc3d:
              - 'volume-cartographer/CMakeLists.txt'
              - 'volume-cartographer/CMakePresets.json'
              - 'volume-cartographer/scripts/**'
              - 'volume-cartographer/Dockerfile*'
              - 'volume-cartographer/cmake/**'
              - 'volume-cartographer/core/**'
              - 'volume-cartographer/apps/VC3D/**'
              - 'volume-cartographer/utils/**'
              - 'volume-cartographer/libs/**'
              - 'vc_object_store/**'
              - 'vc_reader/**'
              - '.github/workflows/vc3d-ci.yml'
            cli:
              - 'volume-cartographer/CMakeLists.txt'
              - 'volume-cartographer/CMakePresets.json'
              - 'volume-cartographer/scripts/**'
              - 'volume-cartographer/Dockerfile*'
              - 'volume-cartographer/cmake/**'
              - 'volume-cartographer/core/**'
              - 'volume-cartographer/apps/CMakeLists.txt'
              - 'volume-cartographer/apps/src/**'
              - 'volume-cartographer/apps/VC3D/FiberLineGeometry.*'
              - 'volume-cartographer/utils/**'
              - 'volume-cartographer/libs/**'
              - 'vc_object_store/**'
              - 'vc_reader/**'
              - '.github/workflows/vc3d-ci.yml'
            flatboi:
              - 'volume-cartographer/CMakeLists.txt'
              - 'volume-cartographer/CMakePresets.json'
              - 'volume-cartographer/scripts/**'
              - 'volume-cartographer/Dockerfile*'
              - 'volume-cartographer/cmake/FetchLibigl.cmake'
              - 'volume-cartographer/libs/**'
              - '.github/workflows/vc3d-ci.yml'
            mcp:
              - 'volume-cartographer/tools/vc3d-mcp/**'
              - '.github/workflows/vc3d-ci.yml'

  skip:
    name: Skip (no volume-cartographer changes)
    needs: changes
    if: needs.changes.outputs.vc != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - run: echo "No volume-cartographer changes — skipping build."

  test-core:
    name: Linux base tests (Clang QuickBuild)
    needs: changes
    if: needs.changes.outputs.test_core == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Published by vc3d-publish-ghcr.yml; deps recipe hash: 675836fc3d478d17.
    container:
      image: ghcr.io/scrollprize/villa/volume-cartographer@sha256:1bebf104edbd6c290ddbaf8036c919635259f3722e8eddb31340b240baf1ed68
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_C_CUSTOM_CACHE_BUSTER: vc3d-linux-ubuntu-26.04-deps-675836fc3d478d17-clang-quickbuild-o0
    steps:
      - name: Checkout Villa
        id: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Retry checkout Villa
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Install shared build dependencies
        env:
          AGENTS_ALLOW_INSTALL: '1'
        run: bash volume-cartographer/scripts/install_build_deps.sh minimal-build
      # Fibers 3D tests need a real X server and software OpenGL. The pinned
      # builder already contains the database headers, but not these runtimes.
      - name: Install headless OpenGL runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            xvfb xauth libxcb-cursor0 libgl1-mesa-dri libglx-mesa0
      - name: Set up shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0
      - name: Build and test base shard
        working-directory: volume-cartographer
        run: |
          sccache --zero-stats
          cmake -S . -B build/ci-fast-core -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=flang \
            -DCMAKE_AUTOGEN_PARALLEL=4 \
            -DVC_QUICKBUILD_OPT_LEVEL=0 -DVC_USE_SCCACHE=ON \
            -DVC_TESTING=ON -DVC_BUILD_APPS=OFF \
            -DVC_BUILD_FLATBOI=OFF
          cmake --build build/ci-fast-core --target vc_test_core --parallel 4
          # Fibers 3D tests exercise real Qt/OpenGL framebuffers. The offscreen
          # Qt platform cannot host QOpenGLWidget; use Xvfb with Mesa instead.
          QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a -s '-screen 0 1280x1024x24' \
            ctest --test-dir build/ci-fast-core --output-on-failure \
            --parallel 4 -L '^vc-core$'
          sccache --show-stats

  test-specialized:
    name: Linux Lasagna/fiber/GUI tests (Clang QuickBuild)
    needs: changes
    if: needs.changes.outputs.test_specialized == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    container:
      image: ghcr.io/scrollprize/villa/volume-cartographer@sha256:1bebf104edbd6c290ddbaf8036c919635259f3722e8eddb31340b240baf1ed68
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_C_CUSTOM_CACHE_BUSTER: vc3d-linux-ubuntu-26.04-deps-675836fc3d478d17-clang-quickbuild-o0
    steps:
      - name: Checkout Villa
        id: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Retry checkout Villa
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Install shared build dependencies
        env:
          AGENTS_ALLOW_INSTALL: '1'
        run: bash volume-cartographer/scripts/install_build_deps.sh minimal-build
      - uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0
      - name: Build and test specialized shard
        working-directory: volume-cartographer
        run: |
          sccache --zero-stats
          cmake -S . -B build/ci-fast-specialized -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=flang \
            -DCMAKE_AUTOGEN_PARALLEL=4 \
            -DVC_QUICKBUILD_OPT_LEVEL=0 -DVC_USE_SCCACHE=ON \
            -DVC_TESTING=ON -DVC_BUILD_APPS=OFF \
            -DVC_BUILD_FLATBOI=OFF
          cmake --build build/ci-fast-specialized --target vc_test_specialized --parallel 4
          ctest --test-dir build/ci-fast-specialized --output-on-failure \
            --parallel 4 -L '^vc-specialized$'
          sccache --show-stats

  vc3d-compile-smoke:
    name: Linux VC3D compile and smoke (Clang QuickBuild)
    needs: changes
    if: needs.changes.outputs.vc3d == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    container:
      image: ghcr.io/scrollprize/villa/volume-cartographer@sha256:1bebf104edbd6c290ddbaf8036c919635259f3722e8eddb31340b240baf1ed68
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_C_CUSTOM_CACHE_BUSTER: vc3d-linux-ubuntu-26.04-deps-675836fc3d478d17-clang-quickbuild-o0
    steps:
      - name: Checkout Villa
        id: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Retry checkout Villa
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Install shared build dependencies
        env:
          AGENTS_ALLOW_INSTALL: '1'
        run: bash volume-cartographer/scripts/install_build_deps.sh minimal-build
      - uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0
      - name: Build and smoke VC3D
        working-directory: volume-cartographer
        run: |
          sccache --zero-stats
          cmake -S . -B build/ci-fast-vc3d -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=flang \
            -DCMAKE_AUTOGEN_PARALLEL=4 \
            -DVC_QUICKBUILD_OPT_LEVEL=0 -DVC_USE_SCCACHE=ON \
            -DVC_TESTING=ON -DVC_BUILD_APPS=ON \
            -DVC_BUILD_FLATBOI=OFF
          cmake --build build/ci-fast-vc3d --target VC3D --parallel 4
          python3 -m venv build/ci-fast-vc3d/smoke-venv
          build/ci-fast-vc3d/smoke-venv/bin/pip install ../vc_reader
          QT_QPA_PLATFORM=offscreen build/ci-fast-vc3d/smoke-venv/bin/python apps/VC3D/agent_bridge/test/smoke_offscreen.py \
            --vc3d build/ci-fast-vc3d/bin/VC3D
          # VC_TESTING compiles VC3D's --test-object-store entry point; the
          # test shards build without apps, so the controller test runs here.
          ctest --test-dir build/ci-fast-vc3d --output-on-failure \
            -R '^object_store_vc3d_controller$'
          sccache --show-stats

  cli-compile:
    name: Linux CLI compile coverage (Clang QuickBuild)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    container:
      image: ghcr.io/scrollprize/villa/volume-cartographer@sha256:1bebf104edbd6c290ddbaf8036c919635259f3722e8eddb31340b240baf1ed68
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_C_CUSTOM_CACHE_BUSTER: vc3d-linux-ubuntu-26.04-deps-675836fc3d478d17-clang-quickbuild-o0
    steps:
      - name: Checkout Villa
        id: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Retry checkout Villa
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Install shared build dependencies
        env:
          AGENTS_ALLOW_INSTALL: '1'
        run: bash volume-cartographer/scripts/install_build_deps.sh minimal-build
      - uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0
      - name: Compile every CLI target
        working-directory: volume-cartographer
        run: |
          sccache --zero-stats
          cmake -S . -B build/ci-fast-cli -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=flang \
            -DCMAKE_AUTOGEN_PARALLEL=4 \
            -DVC_QUICKBUILD_OPT_LEVEL=0 -DVC_USE_SCCACHE=ON \
            -DVC_TESTING=OFF -DVC_BUILD_APPS=ON \
            -DVC_BUILD_FLATBOI=OFF
          cmake --build build/ci-fast-cli --target vc_cli_all --parallel 4
          sccache --show-stats
      - name: Test renderer file-log cleanup
        working-directory: volume-cartographer
        timeout-minutes: 2
        run: python3 core/test/test_render_tifxyz_logging.py build/ci-fast-cli/bin/vc_render_tifxyz

  flatboi-compile:
    name: Linux Flatboi/PaStiX compile coverage (Clang QuickBuild)
    needs: changes
    if: needs.changes.outputs.flatboi == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    container:
      image: ghcr.io/scrollprize/villa/volume-cartographer@sha256:1bebf104edbd6c290ddbaf8036c919635259f3722e8eddb31340b240baf1ed68
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_C_CUSTOM_CACHE_BUSTER: vc3d-linux-ubuntu-26.04-deps-675836fc3d478d17-clang-quickbuild-o0
    steps:
      - name: Checkout Villa
        id: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Retry checkout Villa
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Install shared build dependencies
        env:
          AGENTS_ALLOW_INSTALL: '1'
        run: bash volume-cartographer/scripts/install_build_deps.sh minimal-build
      - uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0
      - name: Build and test Flatboi and PaStiX
        working-directory: volume-cartographer
        run: |
          sccache --zero-stats
          cmake -S . -B build/ci-fast-flatboi -G Ninja \
            -DCMAKE_BUILD_TYPE=QuickBuild \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=flang \
            -DCMAKE_AUTOGEN_PARALLEL=4 \
            -DVC_QUICKBUILD_OPT_LEVEL=0 -DVC_USE_SCCACHE=ON \
            -DVC_TESTING=OFF -DVC_BUILD_APPS=OFF \
            -DVC_BUILD_FLATBOI=ON \
            -DFLATBOI_BUILD_SLIM_TESTS=ON
          ninja -C build/ci-fast-flatboi flatboi check_slim_assembly -j4
          sccache --show-stats

  mcp-test:
    name: MCP unit tests
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout Villa
        id: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Retry checkout Villa
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MCP bridge
        working-directory: volume-cartographer/tools/vc3d-mcp
        run: python -m pip install -e .
      - name: Test MCP bridge
        working-directory: volume-cartographer/tools/vc3d-mcp
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -p 'test*.py'

  # macOS QuickBuild compile is a hard PR gate. Optimized builds, packaging,
  # and packaged-app smoke checks run after merge and on releases.
  macos-build:
    name: macOS compile (${{ matrix.os }}, Homebrew LLVM)
    needs: changes
    # Keep the required compile gate on PRs without rebuilding it after merge.
    # Compiler flags distinguish QuickBuild cache entries from packaging builds.
    if: needs.changes.outputs.vc == 'true' && github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      AGENTS_AGENT_MODE: '1'
      AGENTS_ALLOW_INSTALL: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_C_CUSTOM_CACHE_BUSTER: vc3d-macos-15-arm64-homebrew-native-v1
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-6vcpu-macos-15]
    steps:
      - name: Checkout Villa
        id: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader
      - name: Retry checkout Villa
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          sparse-checkout: |
            volume-cartographer
            vc_object_store
            vc_reader

      - name: Set up shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0

      - name: Install Homebrew dependencies + QuickBuild
        run: volume-cartographer/scripts/build_macos.sh --install-deps --sccache --quickbuild

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test MCP bridge
        working-directory: volume-cartographer/tools/vc3d-mcp
        run: |
          python -m pip install -e .
          python -m unittest discover -p 'test*.py'

  ci:
    name: CI
    needs: [changes, skip, test-core, test-specialized, vc3d-compile-smoke, cli-compile, flatboi-compile, mcp-test, macos-build]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Aggregate required-check result
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_SKIP: ${{ needs.skip.result }}
          R_TEST_CORE: ${{ needs.test-core.result }}
          R_TEST_SPECIALIZED: ${{ needs.test-specialized.result }}
          R_VC3D: ${{ needs.vc3d-compile-smoke.result }}
          R_CLI: ${{ needs.cli-compile.result }}
          R_FLATBOI: ${{ needs.flatboi-compile.result }}
          R_MCP_TEST: ${{ needs.mcp-test.result }}
          R_MACOS: ${{ needs.macos-build.result }}
        run: |
          set -e
          echo "changes=$R_CHANGES skip=$R_SKIP core=$R_TEST_CORE specialized=$R_TEST_SPECIALIZED vc3d=$R_VC3D cli=$R_CLI flatboi=$R_FLATBOI mcp=$R_MCP_TEST macos=$R_MACOS"
          # All non-skipped jobs must succeed (or be skipped legitimately).
          fail=0
          for r in "$R_CHANGES" "$R_SKIP" "$R_TEST_CORE" "$R_TEST_SPECIALIZED" "$R_VC3D" "$R_CLI" "$R_FLATBOI" "$R_MCP_TEST" "$R_MACOS"; do
            case "$r" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed."
