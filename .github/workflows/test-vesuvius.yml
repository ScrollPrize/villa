name: Test vesuvius Python

on:
  pull_request:
    paths:
      - 'vesuvius/**'
      - 'lasagna/**'
      # Local source dependencies installed by uv sync --extra all.
      - 'volume-cartographer/**'
      - 'vc_object_store/**'
      - 'vc_reader/**'
      - '.github/workflows/test-vesuvius.yml'
  # Trusted main builds populate sccache entries that pull requests can read
  # (as in vc3d-ci.yml). Caches written by pull_request runs are scoped to that
  # PR's merge ref, so without main builds every PR compiles from scratch.
  push:
    branches: [main]
    paths:
      - 'vesuvius/**'
      - 'lasagna/**'
      - 'volume-cartographer/**'
      - 'vc_object_store/**'
      - 'vc_reader/**'
      - '.github/workflows/test-vesuvius.yml'

jobs:
  test-vesuvius-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
            # Limit the test matrix to ubuntu-latest for now, as other platforms may not
            # support all dependencies yet.  Extend this list once the build scripts
            # for macOS and Windows are confirmed.
            os: [blacksmith-4vcpu-ubuntu-2404]
            zarr: ['2.18.7', '3.2.1']
    defaults:
      run:
        shell: bash
        working-directory: ./vesuvius
    env:
      # uv rebuilds the native packages (vc_reader, vc_object_store,
      # volume-cartographer) on every run: their uv cache-keys compare file
      # modification times, which a fresh checkout always changes. Route their
      # CMake compiles through sccache so unchanged objects come from the cache.
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # A fixed build directory per package keeps compiler command lines, and so
      # sccache keys, identical between runs (scikit-build-core otherwise builds
      # in a fresh temporary directory).
      SKBUILD_BUILD_DIR: build/{wheel_tag}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Native dependency closure for the Python-only scikit-build
          # configurations of volume-cartographer (apps, UI tracer, flatboi,
          # tests: OFF) and vc_object_store (tools: OFF).
          # qt6-base-dev: utils links Qt6::Core (SFTP remote access, #1941).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            libblosc-dev \
            libblosc2-dev \
            libboost-dev \
            libceres-dev \
            libconcurrentqueue-dev \
            libcurl4-openssl-dev \
            libeigen3-dev \
            liblz4-dev \
            libopencv-contrib-dev \
            libopencv-dev \
            libsuitesparse-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libzstd-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config \
            qt6-base-dev \
            zlib1g-dev

      - name: Set up shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0

      - name: Install uv and restore dependency cache
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Preserve downloaded wheels as well as built wheels; the ML stack
          # is expensive to download again. Never cache the virtualenv itself.
          prune-cache: false
          cache-suffix: vesuvius-zarr-${{ matrix.zarr }}
          # Include transitive reader sources: volume-cartographer's own uv
          # wheel cache keys do not currently cover this sibling dependency.
          cache-dependency-glob: |
            .github/workflows/test-vesuvius.yml
            vesuvius/uv.lock
            vesuvius/pyproject.toml
            volume-cartographer/pyproject.toml
            vc_object_store/pyproject.toml
            vc_reader/**
            gpu_manager/pyproject.toml
            segmentation/models/batchgeneratorsv2/pyproject.toml
            segmentation/models/arch/nnunet/pyproject.toml

      - name: Sync dependencies
        run: |
          sccache --zero-stats
          uv sync --extra all
          sccache --show-stats

      - name: Select Zarr version
        run: uv pip install "zarr==${{ matrix.zarr }}"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-sync pytest tests -m "not slow and not network"
