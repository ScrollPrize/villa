name: Publish VC3D images (ghcr.io)

# Publishes both the reusable dependency builder and the user-facing
# volume-cartographer runtime image. The runtime stage is rebuilt for every
# VC source change, smoke-tested before publication, then advances :edge and
# :main only after the required CLI interfaces are verified.

on:
  push:
    branches: [main]
    paths:
      - 'volume-cartographer/**'
      - '.github/workflows/vc3d-publish-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }} images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish dependency builder if its inputs changed
        run: volume-cartographer/scripts/ci.sh publish ${{ matrix.image }}
      - name: Build, smoke, and publish runtime image
        run: volume-cartographer/scripts/ci.sh publish-runtime ${{ matrix.image }}
