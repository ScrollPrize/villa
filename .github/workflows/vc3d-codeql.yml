name: CodeQL

on:
  # Always trigger on PRs so required checks appear and can succeed fast via a no-op.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The deep scan builds everything and takes ~1.5 h, too long to run on every
  # push to main. Run it weekly (Sunday 03:17 UTC), or on demand.
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
    outputs:
      vc: ${{ steps.filter.outputs.vc }}
    steps:
      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            vc:
              - 'volume-cartographer/**'
              - '.github/codeql/**'
              - '.github/workflows/vc3d-codeql.yml'

  # Fast PR scans use independent source databases so extraction and queries
  # run concurrently. The post-merge deep scan remains monolithic to retain
  # cross-component data-flow analysis.
  analyze_fast_shards:
    name: PR scan (${{ matrix.name }})
    if: github.event_name == 'pull_request' && needs.changes.outputs.vc == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            id: core
            config: .github/codeql/codeql-pr-core.yml
          - name: VC3D controllers
            id: vc3d-controllers
            config: .github/codeql/codeql-pr-vc3d-controllers.yml
          - name: VC3D components
            id: vc3d-components
            config: .github/codeql/codeql-pr-vc3d-components.yml
          - name: tools and libraries
            id: tools-libs
            config: .github/codeql/codeql-pr-tools-libs.yml
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL (no build)
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: none
          queries: security-extended
          config-file: ${{ matrix.config }}

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp/shard:${{ matrix.id }}"

  # Preserve the existing required-check name while making it reflect every
  # parallel PR shard. Unrelated PRs still receive a successful no-op result.
  analyze_fast:
    if: always() && github.event_name == 'pull_request'
    needs: [changes, analyze_fast_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify change detection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT" >&2
            exit 1
          fi

      - name: No-op (unrelated changes)
        if: needs.changes.outputs.vc != 'true'
        run: echo "No volume-cartographer or CodeQL changes; PR scan skipped."

      - name: Verify PR scan shards
        if: needs.changes.outputs.vc == 'true'
        env:
          SHARDS_RESULT: ${{ needs.analyze_fast_shards.result }}
        run: |
          if [[ "$SHARDS_RESULT" != "success" ]]; then
            echo "One or more CodeQL PR shards failed: $SHARDS_RESULT" >&2
            exit 1
          fi

  # Deep scan (weekly / on demand): builds the code for full data-flow analysis
  analyze_deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Pin to Ubuntu 26.04 (resolute) rather than ubuntu-latest (still 24.04).
    # install_build_deps.sh — the single source of truth for the VC3D
    # toolchain, shared with the Dockerfile (FROM ubuntu:26.04) — pulls
    # flang-21 / libclang-rt-21-dev, which only exist in 26.04's default
    # repos. On noble the deps install failed with "Unable to locate package".
    # NOTE: ubuntu-26.04 is currently a *preview* runner image; revisit once
    # ubuntu-latest migrates to 26.04 (GA), at which point this pin can drop.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    container:
      image: ghcr.io/scrollprize/villa/volume-cartographer@sha256:9407753393547c422c9689cb8da6b6f4415cc91ad8fa4d89eb476a3df540d7f8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      security-events: write
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # history-aware queries if needed

      - name: Install shared build dependencies
        env:
          AGENTS_ALLOW_INSTALL: '1'
        run: bash volume-cartographer/scripts/install_build_deps.sh minimal-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended,security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Configure (Ninja, fast flags)
        working-directory: ./volume-cartographer
        run: |
          cmake -S . -B build -G Ninja \
                -DVC_TESTING=OFF \
                -DCMAKE_BUILD_TYPE=Debug \
                -DVC_DEBUG_INFO=OFF \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++

      # Since #2440 the heaviest translation units need 2-4.5 GB each to
      # compile (Debug, gcc), and the CodeQL extractor runs per unit too. At
      # ninja's default nproc+2 jobs the 16 GB runner ran out of memory and the
      # job died with exit 137. Size the job count to memory instead.
      - name: Build (fast)
        working-directory: ./volume-cartographer
        run: |
          mem_gib=$(awk '/^MemTotal:/ {print int($2 / 1048576)}' /proc/meminfo)
          jobs=$(( mem_gib / 4 ))
          if [ "$jobs" -lt 1 ]; then jobs=1; fi
          if [ "$jobs" -gt "$(nproc)" ]; then jobs=$(nproc); fi
          echo "MemTotal ${mem_gib} GiB, $(nproc) CPUs: ninja -j${jobs}"
          ninja -C build -j"${jobs}"

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
          upload: never
          output: sarif-results

      # paths-ignore in the config file does not apply to scans that build the
      # code. Drop results in the build tree instead: third-party sources
      # fetched into build/_deps and generated code (moc, autogen), which were
      # over half of all open alerts.
      - name: Drop results in the build tree
        run: |
          for f in sarif-results/*.sarif; do
            jq '.runs[].results |= map(select(
                  ((.locations[0].physicalLocation.artifactLocation.uri // "")
                   | startswith("volume-cartographer/build/")) | not))' \
              "$f" > "$f.tmp"
            echo "$f: $(jq '[.runs[].results[]] | length' "$f") -> $(jq '[.runs[].results[]] | length' "$f.tmp") results"
            mv "$f.tmp" "$f"
          done

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
          category: "/language:c-cpp"
