[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "villa-gpu-manager"
version = "0.1.0"
description = "Cooperative single-node GPU and CPU reservation service"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
villa-gpu-manager = "villa_gpu_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["torch: optional CPU PyTorch/Gloo integration (not a runtime dependency)"]
